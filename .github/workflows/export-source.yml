name: Export source tree
on:
  push:
    branches: [v23-full-clean]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create source ZIP
        run: |
          mkdir -p /tmp/export
          rsync -a --exclude='.git' --exclude='node_modules' ./ /tmp/export/service-desk-source/
          cd /tmp/export
          zip -qr service-desk-source.zip service-desk-source
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: service-desk-source
          path: /tmp/export/service-desk-source.zip
          if-no-files-found: error
